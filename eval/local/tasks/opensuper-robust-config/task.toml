[metadata]
name = "opensuper-robust-config"
description = "Add structured error handling to a brittle INI config loader so malformed input raises clear ConfigError instead of crashing"
difficulty = "hard"
category = "opensuper"
tags = ["opensuper", "workflow", "error-handling", "robustness"]
default_treatments = [
    "CONTROL",
    "OPENSUPER_FULL_040_BETA",
    "OPENSUPER_FULL_039",
]

[template]
required = []

[environment]
description = "Python INI config loader with brittle error handling. Claude must add structured errors via the opensuper workflow."
dockerfile = "environment/Dockerfile"
timeout_sec = 900

[validation]
test_scripts = "test_robust_config.py"
target_artifacts = []
timeout = 120
