name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA on main with successful CI
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: opensuper-npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI for exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.commit }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          main_sha=$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')
          test "$RELEASE_SHA" = "$main_sha"
          passed=$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&branch=main&event=push&per_page=100" --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")] | length')
          test "$passed" -gt 0

      - name: Checkout verified commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify candidate
        run: |
          pnpm build
          pnpm check:generated
          pnpm lint
          pnpm format:check
          pnpm test:package-e2e
          pnpm run prepublishOnly
          npm audit --omit=dev --registry=https://registry.npmjs.org/

      - name: Pack candidate
        id: pack
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/opensuper-release"
          npm pack --pack-destination "$RUNNER_TEMP/opensuper-release"
          mapfile -t packages < <(find "$RUNNER_TEMP/opensuper-release" -maxdepth 1 -type f -name '*.tgz')
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected one tarball, found ${#packages[@]}" >&2
            exit 1
          fi
          echo "tarball=${packages[0]}" >> "$GITHUB_OUTPUT"

      - name: Scan and install exact candidate
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/opensuper-scan" "$RUNNER_TEMP/opensuper-smoke"
          tar -xzf "${{ steps.pack.outputs.tarball }}" -C "$RUNNER_TEMP/opensuper-scan"
          node scripts/release/prepublish-check.js "$RUNNER_TEMP/opensuper-scan/package"
          npm install --prefix "$RUNNER_TEMP/opensuper-smoke" "${{ steps.pack.outputs.tarball }}" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
          expected=$(node -p "require('./package.json').version")
          actual=$(node "$RUNNER_TEMP/opensuper-smoke/node_modules/@pzy560117/opensuper/bin/opensuper.js" --version)
          test "$actual" = "$expected"

      - name: Publish exact candidate
        run: npm publish "${{ steps.pack.outputs.tarball }}" --ignore-scripts --access public --registry=https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
